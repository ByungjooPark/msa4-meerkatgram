spring:
  application:
    name: msa4-meerkatgram
    version: v1

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

  # DB
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

server:
  error:
    include-stacktrace: never
    include-message: never

# Springdoc Openapi
springdoc:
  # 클라이언트가 서버로 데이터를 보낼 때의 기본 형식을 지정하는 속성
  default-consumes-media-type: application/json
  # 서버가 클라이언트로 데이터를 보낼 때의 기본 형식을 지정하는 속성
  default-produces-media-type: application/json
  swagger-ui:
    # Swagger UI 접속 경로 설정
    path: /swagger-ui.html
    # API 정렬 기준
    operations-sorter: alpha
  api-docs:
    # OpenAPI 스펙을 JSON 파일로 확인할 수 있는 경로
    path: /api-docs

# Log
logging:
  file:
    # 로그 파일 경로
    name: logs/error.log
  level:
    # 로그 출력 레벨 설정 (trace, debug, info, warn, error)
    root: error

    # 특정 패키지만 로그 출력 레벨 설정
    com.msa4spring.controllers: error

# Security & JWT
security:
  jwt:
    secure: false
    issuer: meerkat@meerkat.kr
    type: JWT
    access-token-expiry: 100000000
    refresh-token-expiry: 1296000000
    refresh-token-cookie-name: refresh-token
    refresh-token-cookie-expiry: 1296000
    secret: ${JWT_SECRET}
    header-key: Authorization
    scheme: Bearer
    reissue-uri: /api/reissue-token

# file
file:
  server-uri: ${SERVER_URI:http://localhost:8080}
  storage-path: /storage
  profile-path: /files/profiles
  post-path: /files/posts
  allow-extension-list: [
    "image/jpg",
    "image/jpeg",
    "image/png",
    "image/gif",
    "image/svg",
    "image/webp"
  ]

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}
  max-age: 3600